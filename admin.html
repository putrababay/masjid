<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Informasi Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f4f7f6; padding: 20px; }
    .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
    .section-title {
      border-left: 5px solid #198754;
      padding-left: 10px;
      margin-bottom: 20px;
      color: #198754;
    }
    .crud-card {
      border: 1px solid #dbe5e1;
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }
    .crud-list-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .preview-box {
      border: 1px dashed #94a3b8;
      border-radius: 10px;
      padding: 8px;
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
    }
    .preview-box img,
    .preview-box iframe {
      max-width: 100%;
      width: 100%;
      border-radius: 8px;
      max-height: 220px;
    }
    .muted-help { font-size: 0.85rem; color: #64748b; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .gdrive-banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <div id="adminPageRoot">
    <div class="card p-4 border-0 shadow-sm">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div class="muted-help">
          <span id="loginAs">-</span> · Masjid: <strong id="topMosqueId">-</strong>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a id="previewLink" href="index.html" target="_blank" class="btn btn-outline-success btn-sm">Preview TV</a>
          <a id="sliderPageLink" href="slider.html" class="btn btn-outline-primary btn-sm">Kelola Slider</a>
          <a id="scheduleLink" href="jadwal.html" class="btn btn-outline-warning btn-sm">Jadwal Sholat</a>
        </div>
      </div>

          <form id="adminForm">
            <h5 class="section-title">Identitas Masjid</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Sumber Jadwal Sholat</label>
                <select name="prayerProvider" class="form-select">
                  <option value="NU">NU / LFNU (Subuh -20°, Isya -18°)</option>
                  <option value="KHGT">Muhammadiyah (KHGT)</option>
                </select>
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label">KHGT Lat</label>
                <input type="number" step="any" name="khgtLat" class="form-control" value="-7.4467" />
              </div>
              <div class="col-md-3 mb-3">
                <label class="form-label">KHGT Lng</label>
                <input type="number" step="any" name="khgtLng" class="form-control" value="112.7181" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">ID Lokasi MyQuran</label>
              <input type="text" name="locationId" class="form-control" value="cfa0860e83a4c3a763a7e62d825349f7" />
            </div>
            <div class="mb-3">
              <label class="form-label">Nama Masjid</label>
              <input type="text" name="masjidName" class="form-control" value="MASJID AN-NUR SIDOARJO" />
            </div>
            <div class="mb-3">
              <label class="form-label">Alamat</label>
              <textarea name="masjidAddress" class="form-control" rows="2">Jl. Mojopahit No.666, Celep, Kabupaten Sidoarjo</textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">ID Masjid</label>
                <input type="text" name="mosqueId" id="mosqueIdInput" class="form-control" value="MNR-SDA01" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Kapasitas</label>
                <input type="text" name="capacity" class="form-control" value="800 Jamaah" />
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Ketua</label>
                <input type="text" name="chairman" class="form-control" value="H. Ahmad Fulan" />
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Sekretaris</label>
                <input type="text" name="secretary" class="form-control" value="Budi Santoso, ST" />
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Bendahara</label>
                <input type="text" name="treasurer" class="form-control" value="H. M. Mansur" />
              </div>
            </div>

            <h5 class="section-title">Media & YouTube / Google Drive</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Video ID (Reguler / fallback)</label>
                <input type="text" name="regularVideoId" class="form-control" placeholder="F8121v_ER9M" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Video ID (Live Stream / fallback)</label>
                <input type="text" name="liveVideoId" class="form-control" placeholder="OFLYbSRpMdg" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">URL Folder Google Drive</label>
              <input type="url" name="gdriveFolderUrl" class="form-control"
                value="https://drive.google.com/drive/folders/1oX7T4ZEZpJXi6FSOXKw8fkLB99PjMhgC?usp=sharing" />
            </div>

            <div class="gdrive-banner mb-3">
              <strong>Slider TV</strong>
              <div class="muted-help mb-1">Kelola slide gambar/YouTube/Drive di menu Master Slider.</div>
              <a id="sliderBannerLink" href="slider.html">Buka Master Slider</a>
            </div>

            <div class="mb-3">
              <label class="form-label">Judul QRIS</label>
              <input type="text" name="qrisTitle" class="form-control" value="Infaq & Sedekah" />
            </div>
            <div class="mb-3">
              <label class="form-label">URL Gambar QRIS (boleh link Google Drive)</label>
              <input type="text" name="qrisImageUrl" class="form-control"
                value="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=DonasiMasjidAnNurSidoarjo" />
              <div class="preview-box mt-2" id="qrisPreviewBox">
                <span class="muted-help">Preview QRIS</span>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Caption QRIS</label>
              <input type="text" name="qrisCaption" class="form-control" value="Scan QRIS a.n Masjid An-Nur" />
            </div>

            <h5 class="section-title">Laporan Keuangan</h5>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Saldo Awal</label>
                <input type="text" name="balanceStart" class="form-control" value="Rp 15.000.000" />
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Pemasukan</label>
                <input type="text" name="income" class="form-control" value="Rp 5.500.000" />
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Pengeluaran</label>
                <input type="text" name="expense" class="form-control" value="Rp 2.150.000" />
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Saldo Akhir</label>
                <input type="text" name="balanceEnd" class="form-control" value="Rp 18.350.000" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Tanggal Update</label>
                <input type="text" name="balanceUpdatedAt" class="form-control" value="10 Maret 2026" />
              </div>
            </div>

            <h5 class="section-title">Pesan Berjalan (Marquee)</h5>
            <div class="crud-card mb-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label mb-0 fw-bold">Pesan Berjalan (CRUD)</label>
                <button type="button" class="btn btn-success btn-sm" id="addRunningTextBtn">+ Tambah Pesan</button>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-12">
                  <textarea id="runningTextInput" class="form-control" rows="2"
                    placeholder="Tulis isi pesan berjalan..."></textarea>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button type="button" class="btn btn-primary btn-sm" id="saveRunningTextBtn">Simpan Pesan</button>
                  <button type="button" class="btn btn-secondary btn-sm" id="resetRunningTextBtn">Reset</button>
                </div>
              </div>
              <div id="runningTextList"></div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">SIMPAN PERUBAHAN</button>
          </form>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/admin-shell.js"></script>
  <script>
    let CURRENT_MOSQUE_ID = "MNR-SDA01";
    let currentUser = null;
    let form = null;
    let runningTextsState = [];
    let editingRunningTextIndex = -1;
    let el = {};

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderQrisPreview() {
      const raw = form.elements.qrisImageUrl?.value || "";
      const src = MasjidDB.toDriveImageUrl(raw);
      if (!src) {
        el.qrisPreviewBox.innerHTML = '<span class="muted-help">Preview QRIS</span>';
        return;
      }
      el.qrisPreviewBox.innerHTML = `<img src="${escapeHtml(src)}" alt="QRIS" style="max-width:180px" onerror="this.outerHTML='<span class=&quot;muted-help&quot;>Gagal load QRIS</span>'">`;
    }

    function resetRunningTextForm() {
      editingRunningTextIndex = -1;
      el.runningTextInput.value = "";
    }

    function renderRunningTextList() {
      if (!runningTextsState.length) {
        el.runningTextList.innerHTML = '<div class="muted-help">Belum ada pesan berjalan.</div>';
        return;
      }
      el.runningTextList.innerHTML = runningTextsState
        .map((text, idx) => `<div class="crud-list-item">
          <div>${idx + 1}. ${escapeHtml(text)}</div>
          <div class="d-flex gap-1">
            <button type="button" class="btn btn-outline-primary btn-sm" data-edit-rt="${idx}">Edit</button>
            <button type="button" class="btn btn-outline-danger btn-sm" data-del-rt="${idx}">Hapus</button>
          </div>
        </div>`)
        .join("");
    }

    function fillForm(settings) {
      Object.keys(settings).forEach((key) => {
        const input = form.elements[key];
        if (key === "runningTexts" && Array.isArray(settings.runningTexts)) {
          runningTextsState = [...settings.runningTexts];
          renderRunningTextList();
        } else if (key === "slides") {
          return;
        } else if (key === "khgt" && settings.khgt) {
          if (form.elements.khgtLat) form.elements.khgtLat.value = settings.khgt.lat ?? "";
          if (form.elements.khgtLng) form.elements.khgtLng.value = settings.khgt.lng ?? "";
        } else if (input && typeof settings[key] === "string") {
          input.value = settings[key];
        }
      });

      const mid = settings.mosqueId || CURRENT_MOSQUE_ID;
      CURRENT_MOSQUE_ID = mid;
      if (form.elements.mosqueId) form.elements.mosqueId.value = mid;
      el.topMosqueId.textContent = mid;
      el.previewLink.href = `index.html?mosque=${encodeURIComponent(mid)}`;
      el.sliderPageLink.href = `slider.html?mosque=${encodeURIComponent(mid)}`;
      el.sliderBannerLink.href = `slider.html?mosque=${encodeURIComponent(mid)}`;
      el.scheduleLink.href = `jadwal.html?mosque=${encodeURIComponent(mid)}`;
      document.getElementById("adminTopMeta").textContent = `Masjid: ${mid}`;
      renderQrisPreview();
    }

    (async () => {
      currentUser = await AdminShell.mount({
        page: "settings",
        title: "Master Setting Masjid",
      });
      if (!currentUser) return;

      form = document.getElementById("adminForm");
      el = {
        runningTextInput: document.getElementById("runningTextInput"),
        addRunningTextBtn: document.getElementById("addRunningTextBtn"),
        saveRunningTextBtn: document.getElementById("saveRunningTextBtn"),
        resetRunningTextBtn: document.getElementById("resetRunningTextBtn"),
        runningTextList: document.getElementById("runningTextList"),
        qrisPreviewBox: document.getElementById("qrisPreviewBox"),
        previewLink: document.getElementById("previewLink"),
        topMosqueId: document.getElementById("topMosqueId"),
        loginAs: document.getElementById("loginAs"),
        scheduleLink: document.getElementById("scheduleLink"),
        mosqueIdInput: document.getElementById("mosqueIdInput"),
        sliderPageLink: document.getElementById("sliderPageLink"),
        sliderBannerLink: document.getElementById("sliderBannerLink"),
      };

      el.loginAs.textContent = currentUser.name || currentUser.username;
      if (currentUser.role === "superadmin") {
        const q = new URLSearchParams(location.search).get("mosque");
        CURRENT_MOSQUE_ID = q || currentUser.mosqueId || "MNR-SDA01";
      } else {
        CURRENT_MOSQUE_ID = currentUser.mosqueId || "MNR-SDA01";
        el.mosqueIdInput.readOnly = true;
      }

      el.topMosqueId.textContent = CURRENT_MOSQUE_ID;
      el.previewLink.href = `index.html?mosque=${encodeURIComponent(CURRENT_MOSQUE_ID)}`;
      el.scheduleLink.href = `jadwal.html?mosque=${encodeURIComponent(CURRENT_MOSQUE_ID)}`;
      el.sliderPageLink.href = `slider.html?mosque=${encodeURIComponent(CURRENT_MOSQUE_ID)}`;
      el.sliderBannerLink.href = `slider.html?mosque=${encodeURIComponent(CURRENT_MOSQUE_ID)}`;
      document.getElementById("adminTopMeta").textContent = `Masjid: ${CURRENT_MOSQUE_ID}`;

      el.runningTextList.addEventListener("click", (e) => {
        const editIdx = e.target.getAttribute("data-edit-rt");
        const delIdx = e.target.getAttribute("data-del-rt");
        if (editIdx !== null) {
          editingRunningTextIndex = Number(editIdx);
          el.runningTextInput.value = runningTextsState[editingRunningTextIndex] || "";
        }
        if (delIdx !== null) {
          runningTextsState.splice(Number(delIdx), 1);
          renderRunningTextList();
          resetRunningTextForm();
        }
      });

      form.onsubmit = async function (e) {
        e.preventDefault();
        const formData = new FormData(form);
        const settings = Object.fromEntries(formData.entries());
        settings.runningTexts = [...runningTextsState];
        settings.qrisImageUrl = MasjidDB.toDriveImageUrl(settings.qrisImageUrl || "");
        const parsedLat = Number(settings.khgtLat);
        const parsedLng = Number(settings.khgtLng);
        settings.khgt = {
          lat: Number.isFinite(parsedLat) ? parsedLat : -7.4467,
          lng: Number.isFinite(parsedLng) ? parsedLng : 112.7181,
        };
        delete settings.khgtLat;
        delete settings.khgtLng;

        try {
          await MasjidDB.saveSettings(settings.mosqueId || CURRENT_MOSQUE_ID, settings);
          alert("Data berhasil disimpan.");
        } catch (err) {
          alert("Gagal menyimpan: " + err.message);
        }
      };

      form.elements.qrisImageUrl?.addEventListener("input", renderQrisPreview);
      el.addRunningTextBtn.addEventListener("click", resetRunningTextForm);
      el.resetRunningTextBtn.addEventListener("click", resetRunningTextForm);
      el.saveRunningTextBtn.addEventListener("click", () => {
        const text = (el.runningTextInput.value || "").trim();
        if (!text) {
          alert("Pesan berjalan tidak boleh kosong.");
          return;
        }
        if (editingRunningTextIndex >= 0) runningTextsState[editingRunningTextIndex] = text;
        else runningTextsState.push(text);
        renderRunningTextList();
        resetRunningTextForm();
      });

      resetRunningTextForm();
      renderRunningTextList();

      const data = await MasjidDB.getSettings(CURRENT_MOSQUE_ID, true);
      if (data.settings) fillForm(data.settings);
    })();
  </script>
</body>

</html>
