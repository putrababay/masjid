<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Slider - Masjid TV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
  <style>
    .crud-card {
      border: 1px solid #dbe5e1;
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }
    .crud-list-item {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .preview-box {
      border: 1px dashed #94a3b8;
      border-radius: 10px;
      padding: 8px;
      min-height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
    }
    .preview-box img,
    .preview-box iframe {
      max-width: 100%;
      width: 100%;
      border-radius: 8px;
      max-height: 220px;
    }
    .muted-help { font-size: 0.85rem; color: #64748b; }
    .gdrive-banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 1rem;
    }
    .drive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .drive-item {
      border: 1px solid #cbd5f5;
      border-radius: 10px;
      padding: 8px;
      background: #fff;
      cursor: pointer;
    }
    .drive-item.selected {
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.2);
    }
    .drive-item .thumb {
      width: 100%;
      height: 96px;
      object-fit: cover;
      border-radius: 8px;
      background: #e2e8f0;
      display: block;
    }
    .drive-item .name {
      font-size: 0.78rem;
      margin-top: 6px;
      word-break: break-word;
      line-height: 1.2;
    }
    .drive-item .badge-kind { font-size: 0.68rem; }
  </style>
</head>
<body>
  <div id="adminPageRoot">
    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-5">
        <label class="form-label">Masjid</label>
        <select id="mosqueSelect" class="form-select"></select>
      </div>
      <div class="col-md-3">
        <button id="reloadBtn" type="button" class="btn btn-outline-success w-100">Muat Ulang</button>
      </div>
    </div>

    <div class="gdrive-banner">
      <strong>Media Google Drive</strong>
      <div class="muted-help mb-2">
        Upload file ke folder Drive (tombol "Upload ke Drive"), lalu klik "Muat Isi Folder"
        untuk memilih file dan langsung menjadikannya slide. Folder harus dibagikan
        <em>Anyone with the link</em>.
      </div>
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label mb-1">URL Folder Google Drive</label>
          <input type="url" id="driveFolderUrl" class="form-control form-control-sm"
            placeholder="https://drive.google.com/drive/folders/..." />
        </div>
        <div class="col-md-6 d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-success btn-sm" id="driveLoadBtn">Muat Isi Folder</button>
          <a class="btn btn-outline-success btn-sm" id="driveOpenBtn" target="_blank" rel="noopener">Upload ke Drive</a>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="driveSaveFolderBtn">Simpan URL Folder</button>
        </div>
      </div>
      <div id="driveStatus" class="muted-help mt-2"></div>
      <div id="driveGrid" class="drive-grid"></div>
      <div id="driveActions" class="d-none mt-2 d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-primary btn-sm" id="driveAddSelectedBtn">Tambahkan Terpilih Jadi Slide</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="driveSelectAllBtn">Pilih Semua</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="driveClearBtn">Bersihkan Pilihan</button>
      </div>
    </div>

    <div class="panel-card">
      <div class="crud-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label mb-0 fw-bold">Form Slider</label>
          <button type="button" class="btn btn-success btn-sm" id="addSlideBtn">+ Tambah Slide</button>
        </div>
        <input type="hidden" id="slideId" />
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Tipe</label>
            <select id="slideType" class="form-select">
              <option value="image">Image (lokal / Drive)</option>
              <option value="youtube">YouTube</option>
              <option value="gdrive">Video Google Drive</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Mode Video</label>
            <select id="slideIsLive" class="form-select">
              <option value="regular">Regular</option>
              <option value="live">Live</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Durasi (detik)</label>
            <input type="number" id="slideDuration" class="form-control" min="5" value="15" />
          </div>
          <div class="col-12">
            <label class="form-label">Nilai media</label>
            <input type="text" id="slideValue" class="form-control"
              placeholder="1.jpg · YouTube ID · atau link Google Drive file" />
          </div>
          <div class="col-12">
            <div class="preview-box" id="slidePreviewBox">
              <span class="muted-help">Preview media akan tampil di sini</span>
            </div>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="button" class="btn btn-primary btn-sm" id="saveSlideBtn">Simpan Slide</button>
            <button type="button" class="btn btn-secondary btn-sm" id="resetSlideBtn">Reset Form</button>
          </div>
        </div>
        <hr />
        <div id="slideList"></div>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/mosque-table.js"></script>
  <script>
    let slidesState = [];
    let editingIndex = -1;
    let currentSettings = null;
    const driveState = { files: [], selected: new Set() };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeMediaValue(type, value) {
      const raw = String(value || "").trim();
      if (!raw) return "";
      if (type === "youtube") {
        const yt = raw.match(/(?:youtu\.be\/|v=|embed\/)([a-zA-Z0-9_-]{6,})/);
        return yt ? yt[1] : raw;
      }
      return raw;
    }

    function renderSlidePreview() {
      const type = document.getElementById("slideType").value;
      const value = normalizeMediaValue(type, document.getElementById("slideValue").value);
      const box = document.getElementById("slidePreviewBox");
      if (!value) {
        box.innerHTML = '<span class="muted-help">Preview media akan tampil di sini</span>';
        return;
      }
      if (type === "image") {
        box.innerHTML = "";
        const img = document.createElement("img");
        img.alt = "Preview";
        img.addEventListener("drive-image-failed", () => {
          box.innerHTML =
            '<span class="muted-help">Gagal load image. Pastikan file Drive dibagikan publik.</span>';
        });
        MasjidDB.bindDriveImageFallback(img, value, 800);
        box.appendChild(img);
        return;
      }
      if (type === "gdrive") {
        const src = MasjidDB.toDriveEmbedUrl(value);
        box.innerHTML = `<iframe height="200" src="${escapeHtml(src)}" title="Preview Drive" allow="autoplay" allowfullscreen></iframe>`;
        return;
      }
      const isLive = document.getElementById("slideIsLive").value === "live";
      const youtubeSrc = `https://www.youtube.com/embed/${encodeURIComponent(value)}?rel=0&modestbranding=1${isLive ? "" : "&start=0"}`;
      box.innerHTML = `<iframe height="180" src="${youtubeSrc}" title="Preview YouTube" frameborder="0" allowfullscreen></iframe>`;
    }

    function resetSlideForm() {
      editingIndex = -1;
      document.getElementById("slideId").value = "";
      document.getElementById("slideType").value = "image";
      document.getElementById("slideIsLive").value = "regular";
      document.getElementById("slideValue").value = "";
      document.getElementById("slideDuration").value = "15";
      renderSlidePreview();
    }

    function renderSlidesList() {
      const list = document.getElementById("slideList");
      if (!slidesState.length) {
        list.innerHTML = '<div class="muted-help">Belum ada slide.</div>';
        return;
      }
      list.innerHTML = slidesState
        .map((slide, idx) => {
          let label = "";
          if (slide.type === "youtube") label = `YouTube (${slide.isLive ? "Live" : "Regular"}): ${escapeHtml(slide.value)}`;
          else if (slide.type === "gdrive") label = `Google Drive Video: ${escapeHtml(slide.value)}`;
          else label = `Image: ${escapeHtml(slide.value)}`;
          return `<div class="crud-list-item">
            <div>${idx + 1}. ${label}</div>
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-outline-primary btn-sm" data-edit-slide="${idx}">Edit</button>
              <button type="button" class="btn btn-outline-danger btn-sm" data-del-slide="${idx}">Hapus</button>
            </div>
          </div>`;
        })
        .join("");
    }

    function driveFileLink(id) {
      return `https://drive.google.com/file/d/${id}/view`;
    }

    function setDriveStatus(message, isError = false) {
      const box = document.getElementById("driveStatus");
      box.textContent = message || "";
      box.style.color = isError ? "#b91c1c" : "#64748b";
    }

    function renderDriveGrid() {
      const grid = document.getElementById("driveGrid");
      const actions = document.getElementById("driveActions");
      const usable = driveState.files.filter((f) => f.kind === "image" || f.kind === "video");
      if (!usable.length) {
        grid.innerHTML = "";
        actions.classList.add("d-none");
        return;
      }
      actions.classList.remove("d-none");
      grid.innerHTML = usable
        .map((file) => {
          const selected = driveState.selected.has(file.id) ? " selected" : "";
          const thumb = file.thumbnail || MasjidDB.toDriveImageUrl(file.id, 400);
          const badge = file.kind === "image" ? "Image" : "Video";
          return `<div class="drive-item${selected}" data-drive-id="${escapeHtml(file.id)}">
            <img class="thumb" src="${escapeHtml(thumb)}" alt="${escapeHtml(file.name)}" loading="lazy" />
            <div class="name">${escapeHtml(file.name)}</div>
            <span class="badge text-bg-secondary badge-kind">${badge}</span>
          </div>`;
        })
        .join("");

      grid.querySelectorAll(".drive-item").forEach((item) => {
        const id = item.getAttribute("data-drive-id");
        const img = item.querySelector("img.thumb");
        if (!img || !id) return;
        img.addEventListener(
          "error",
          () => {
            MasjidDB.bindDriveImageFallback(img, id, 400);
          },
          { once: true }
        );
      });
    }

    async function loadDriveFolder() {
      const folderUrl = document.getElementById("driveFolderUrl").value.trim();
      if (!folderUrl) {
        setDriveStatus("Isi URL folder Google Drive terlebih dahulu.", true);
        return;
      }
      setDriveStatus("Memuat isi folder Drive...");
      try {
        const result = await MasjidDB.listDriveFolder(folderUrl);
        driveState.files = result.files || [];
        driveState.selected.clear();
        renderDriveGrid();
        const usable = driveState.files.filter((f) => f.kind === "image" || f.kind === "video").length;
        setDriveStatus(
          usable
            ? `${usable} media siap dipilih dari ${result.total} item pada folder.`
            : "Folder terbaca tetapi belum ada file gambar/video."
        );
      } catch (err) {
        driveState.files = [];
        renderDriveGrid();
        setDriveStatus(err.message, true);
      }
    }

    async function addSelectedDriveFiles(mosqueId) {
      const chosen = driveState.files.filter((f) => driveState.selected.has(f.id));
      if (!chosen.length) {
        setDriveStatus("Belum ada file yang dipilih.", true);
        return;
      }
      const existing = new Set(
        slidesState.map((s) => MasjidDB.extractDriveId(s.value)).filter(Boolean)
      );
      let order = slidesState.length;
      let added = 0;
      let skipped = 0;
      for (const file of chosen) {
        if (existing.has(file.id)) {
          skipped += 1;
          continue;
        }
        await MasjidDB.saveSlider({
          mosqueId,
          type: file.kind === "video" ? "gdrive" : "image",
          value: driveFileLink(file.id),
          isLive: false,
          duration: file.kind === "video" ? 30 : 15,
          sortOrder: order,
          isActive: true,
        });
        order += 1;
        added += 1;
      }
      driveState.selected.clear();
      renderDriveGrid();
      await loadSlides();
      setDriveStatus(
        `${added} slide ditambahkan${skipped ? `, ${skipped} dilewati karena sudah ada` : ""}.`
      );
    }

    async function loadMosqueContext(mosqueId) {
      const input = document.getElementById("driveFolderUrl");
      const openLink = document.getElementById("driveOpenBtn");
      try {
        const data = await MasjidDB.getSettings(mosqueId, true);
        currentSettings = data.settings || null;
      } catch {
        currentSettings = null;
      }
      input.value = currentSettings?.gdriveFolderUrl || "";
      const folderId = MasjidDB.extractDriveFolderId(input.value);
      openLink.href = folderId
        ? `https://drive.google.com/drive/folders/${folderId}`
        : "https://drive.google.com/drive/my-drive";
      driveState.files = [];
      driveState.selected.clear();
      renderDriveGrid();
      setDriveStatus(
        input.value ? "" : "Folder Drive belum diatur untuk masjid ini."
      );
    }

    async function saveDriveFolderUrl(mosqueId) {
      const folderUrl = document.getElementById("driveFolderUrl").value.trim();
      if (!currentSettings) {
        setDriveStatus("Setting masjid belum termuat, coba muat ulang.", true);
        return;
      }
      await MasjidDB.saveSettings(mosqueId, {
        ...currentSettings,
        gdriveFolderUrl: folderUrl,
      });
      currentSettings.gdriveFolderUrl = folderUrl;
      setDriveStatus("URL folder Drive tersimpan.");
    }

    async function loadSlides() {
      const mosqueId = document.getElementById("mosqueSelect").value;
      document.getElementById("adminTopMeta").textContent = `Masjid: ${mosqueId}`;
      const data = await MasjidDB.listSliders(mosqueId);
      slidesState = (data.sliders || []).map((s) => ({
        id: s.id,
        type: ["youtube", "gdrive", "image"].includes(s.type) ? s.type : "image",
        value: String(s.value || "").trim(),
        isLive: !!s.isLive,
        duration: Number(s.duration) || 15,
      }));
      renderSlidesList();
      resetSlideForm();
    }

    function bindSliderEvents(mosqueSelect) {
      document.getElementById("slideType").addEventListener("change", renderSlidePreview);
      document.getElementById("slideIsLive").addEventListener("change", renderSlidePreview);
      document.getElementById("slideValue").addEventListener("input", renderSlidePreview);
      document.getElementById("addSlideBtn").addEventListener("click", resetSlideForm);
      document.getElementById("resetSlideBtn").addEventListener("click", resetSlideForm);
      document.getElementById("reloadBtn").addEventListener("click", () => {
        loadSlides().catch((err) => alert(err.message));
      });
      mosqueSelect.addEventListener("change", () => {
        loadMosqueContext(mosqueSelect.value)
          .then(loadSlides)
          .catch((err) => alert(err.message));
      });

      document.getElementById("driveLoadBtn").addEventListener("click", () => {
        loadDriveFolder();
      });
      document.getElementById("driveSaveFolderBtn").addEventListener("click", () => {
        saveDriveFolderUrl(mosqueSelect.value).catch((err) =>
          setDriveStatus(err.message, true)
        );
      });
      document.getElementById("driveFolderUrl").addEventListener("input", (e) => {
        const folderId = MasjidDB.extractDriveFolderId(e.target.value);
        document.getElementById("driveOpenBtn").href = folderId
          ? `https://drive.google.com/drive/folders/${folderId}`
          : "https://drive.google.com/drive/my-drive";
      });
      document.getElementById("driveGrid").addEventListener("click", (e) => {
        const item = e.target.closest("[data-drive-id]");
        if (!item) return;
        const id = item.getAttribute("data-drive-id");
        if (driveState.selected.has(id)) driveState.selected.delete(id);
        else driveState.selected.add(id);
        item.classList.toggle("selected");
      });
      document.getElementById("driveSelectAllBtn").addEventListener("click", () => {
        driveState.files
          .filter((f) => f.kind === "image" || f.kind === "video")
          .forEach((f) => driveState.selected.add(f.id));
        renderDriveGrid();
      });
      document.getElementById("driveClearBtn").addEventListener("click", () => {
        driveState.selected.clear();
        renderDriveGrid();
      });
      document.getElementById("driveAddSelectedBtn").addEventListener("click", () => {
        addSelectedDriveFiles(mosqueSelect.value).catch((err) =>
          setDriveStatus(err.message, true)
        );
      });

      document.getElementById("saveSlideBtn").addEventListener("click", async () => {
        const type = document.getElementById("slideType").value;
        const value = normalizeMediaValue(type, document.getElementById("slideValue").value);
        if (!value) {
          alert("Nilai slide tidak boleh kosong.");
          return;
        }
        const mosqueId = mosqueSelect.value;
        const slide = {
          id: document.getElementById("slideId").value || undefined,
          mosqueId,
          type,
          value,
          isLive: type === "youtube" && document.getElementById("slideIsLive").value === "live",
          duration: Number(document.getElementById("slideDuration").value) || 15,
          sortOrder: editingIndex >= 0 ? editingIndex : slidesState.length,
          isActive: true,
        };
        try {
          await MasjidDB.saveSlider(slide);
          await loadSlides();
          alert("Slide berhasil disimpan.");
        } catch (err) {
          alert(err.message);
        }
      });

      document.getElementById("slideList").addEventListener("click", async (e) => {
        const editIdx = e.target.getAttribute("data-edit-slide");
        const delIdx = e.target.getAttribute("data-del-slide");
        if (editIdx !== null) {
          const idx = Number(editIdx);
          const slide = slidesState[idx];
          if (!slide) return;
          editingIndex = idx;
          document.getElementById("slideId").value = slide.id || "";
          document.getElementById("slideType").value = slide.type;
          document.getElementById("slideIsLive").value = slide.isLive ? "live" : "regular";
          document.getElementById("slideValue").value = slide.value || "";
          document.getElementById("slideDuration").value = slide.duration || 15;
          renderSlidePreview();
        }
        if (delIdx !== null) {
          const idx = Number(delIdx);
          const slide = slidesState[idx];
          if (!confirm("Hapus slide ini?")) return;
          try {
            if (slide?.id) await MasjidDB.deleteSlider(slide.id);
            await loadSlides();
          } catch (err) {
            alert(err.message);
          }
        }
      });
    }

    (async () => {
      const user = await AdminShell.mount({
        page: "slider",
        title: "Master Slider",
      });
      if (!user) return;

      const mosqueParam = new URLSearchParams(location.search).get("mosque");
      if (user.role === "superadmin" && !mosqueParam) {
        document.getElementById("adminContent").innerHTML =
          '<div id="mosqueListWrap"></div>';
        document.getElementById("adminTopMeta").textContent =
          "Pilih masjid untuk mengelola slider";
        await MosqueTable.render("#mosqueListWrap", {
          editUrl: "slider.html",
          pageLabel: "Slider",
        });
        return;
      }

      const mosqueSelect = document.getElementById("mosqueSelect");
      const mosques = await MasjidDB.listAdminMosques();
      const list = mosques.mosques || [];
      mosqueSelect.innerHTML = list
        .map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name || m.id)}</option>`)
        .join("");
      mosqueSelect.value = mosqueParam || user.mosqueId || list[0]?.id || "";

      if (user.role === "superadmin") {
        const back = document.createElement("a");
        back.href = "slider.html";
        back.className = "btn btn-outline-secondary btn-sm";
        back.textContent = "← Daftar Masjid";
        document.getElementById("adminTopActions")?.prepend(back);
      } else {
        mosqueSelect.disabled = true;
      }

      bindSliderEvents(mosqueSelect);
      try {
        await loadMosqueContext(mosqueSelect.value);
        await loadSlides();
      } catch (err) {
        alert(err.message);
      }
    })();
  </script>
</body>
</html>
