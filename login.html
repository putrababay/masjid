<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Smart TV Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --green: #064e3b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.18), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 78, 59, 0.15), transparent 35%),
        #f1f5f9;
    }

    .split {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .panel {
      padding: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-left {
      background: linear-gradient(160deg, #064e3b, #0f766e 55%, #115e59);
      color: #fff;
    }

    .card-box {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 1.75rem;
    }

    .panel-left h1 {
      font-weight: 800;
      font-size: 1.7rem;
      margin-bottom: 0.35rem;
    }

    .panel-left .sub {
      opacity: 0.85;
      margin-bottom: 1.4rem;
      font-size: 0.95rem;
    }

    .form-control {
      border-radius: 10px;
      border: 0;
      padding: 0.75rem 0.9rem;
    }

    .btn-login {
      background: #fbbf24;
      color: #064e3b;
      font-weight: 800;
      border: 0;
      border-radius: 10px;
      padding: 0.75rem;
    }

    .btn-login:hover {
      background: #f59e0b;
      color: #064e3b;
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .auth-tab {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      padding: 0.55rem;
      background: transparent;
      color: #fff;
      font-weight: 700;
    }

    .auth-tab.active {
      background: #fff;
      color: var(--green);
    }

    .auth-form[hidden] {
      display: none;
    }

    .preview-wrap {
      width: min(100%, 560px);
    }

    .preview-wrap h2 {
      color: var(--green);
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    .preview-wrap .desc {
      color: #64748b;
      margin-bottom: 1.2rem;
    }

    .mosque-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .mosque-card h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
    }

    .mosque-card p {
      margin: 0.2rem 0 0;
      color: #64748b;
      font-size: 0.85rem;
    }

    .btn-preview {
      white-space: nowrap;
      background: var(--green);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .btn-preview:hover {
      color: #fff;
      background: #0f766e;
    }

    .empty {
      color: #64748b;
      background: #fff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 1rem;
    }

    @media (max-width: 900px) {
      .split {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="split">
    <section class="panel panel-left">
      <div class="card-box">
        <h1>Administrasi Masjid</h1>
        <div class="sub">Masuk atau daftarkan pengelola masjid baru.</div>
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-auth-tab="login">Login</button>
          <button type="button" class="auth-tab" data-auth-tab="register">Registrasi</button>
        </div>
        <form id="loginForm" class="auth-form">
          <div class="mb-3">
            <label class="form-label">Username atau Email</label>
            <input type="text" class="form-control" name="identity" required autocomplete="username"
              placeholder="username@email.com" />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required autocomplete="current-password"
              placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-login w-100">Masuk</button>
        </form>
        <form id="registerForm" class="auth-form" hidden>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Nama Pengelola</label>
              <input type="text" class="form-control" name="name" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" name="username" minlength="4" required />
            </div>
            <div class="col-12">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" required />
            </div>
            <div class="col-12">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="password" minlength="8" required />
            </div>
            <div class="col-12">
              <label class="form-label">Nama Masjid</label>
              <input type="text" class="form-control" name="mosqueName" required />
            </div>
            <div class="col-12">
              <label class="form-label">Alamat Masjid</label>
              <textarea class="form-control" name="address" rows="2" required></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label">Latitude</label>
              <input type="number" step="any" class="form-control" name="latitude" value="-7.4467" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Longitude</label>
              <input type="number" step="any" class="form-control" name="longitude" value="112.7181" required />
            </div>
          </div>
          <button type="submit" class="btn btn-login w-100 mt-3">Daftar</button>
          <div class="hint">Akun baru menunggu persetujuan superadmin. Pendaftar pertama otomatis menjadi superadmin.</div>
        </form>
        <div id="authMessage" class="text-warning mt-2 small" style="display:none;"></div>
      </div>
    </section>

    <section class="panel panel-right">
      <div class="preview-wrap">
        <h2>Preview User Masjid</h2>
        <p class="desc">Klik untuk membuka tampilan TV seperti index.html tanpa login.</p>
        <div id="mosqueList">
          <div class="empty">Memuat daftar masjid...</div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/db.js"></script>
  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const authMessage = document.getElementById("authMessage");
    const mosqueList = document.getElementById("mosqueList");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadMosques() {
      try {
        await MasjidDB.ready();
        const data = await MasjidDB.listMosques();
        const items = data.mosques || [];
        if (!items.length) {
          mosqueList.innerHTML = '<div class="empty">Belum ada masjid aktif.</div>';
          return;
        }
        mosqueList.innerHTML = items
          .map(
            (m) => `<div class="mosque-card">
              <div>
                <h3>${escapeHtml(m.masjidName || m.mosqueId)}</h3>
                <p>${escapeHtml(m.masjidAddress || "-")}</p>
                <p>ID: ${escapeHtml(m.mosqueId)}</p>
              </div>
              <a class="btn-preview" href="${escapeHtml(m.previewUrl)}" target="_blank" rel="noopener">Preview TV</a>
            </div>`
          )
          .join("");
      } catch (e) {
        mosqueList.innerHTML = '<div class="empty">Gagal memuat daftar masjid.</div>';
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authMessage.style.display = "none";
      const formData = new FormData(loginForm);
      try {
        const result = await MasjidDB.login(
          formData.get("identity"),
          formData.get("password")
        );
        window.location.href = result.redirect || "dashboard.html";
      } catch (err) {
        authMessage.style.display = "block";
        authMessage.textContent = err.message;
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authMessage.style.display = "none";
      const values = Object.fromEntries(new FormData(registerForm));
      values.latitude = Number(values.latitude);
      values.longitude = Number(values.longitude);
      try {
        const result = await MasjidDB.register(values);
        if (result.user) {
          window.location.href = result.redirect || "dashboard.html";
          return;
        }
        authMessage.style.display = "block";
        authMessage.className = "text-success mt-2 small";
        authMessage.textContent = result.message;
        registerForm.reset();
      } catch (err) {
        authMessage.style.display = "block";
        authMessage.className = "text-warning mt-2 small";
        authMessage.textContent = err.message;
      }
    });

    document.querySelectorAll("[data-auth-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.authTab;
        document.querySelectorAll("[data-auth-tab]").forEach((tab) => {
          tab.classList.toggle("active", tab === button);
        });
        loginForm.hidden = target !== "login";
        registerForm.hidden = target !== "register";
        authMessage.style.display = "none";
      });
    });

    (async () => {
      await MasjidDB.ready();
      const user = MasjidDB.getSession();
      if (user) {
        window.location.href =
          user.role === "superadmin" || user.role === "admin_masjid"
            ? "dashboard.html"
            : `index.html?mosque=${encodeURIComponent(user.mosqueId || "")}`;
        return;
      }
      loadMosques();
    })();
  </script>
</body>

</html>
