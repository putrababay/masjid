<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jadwal Sholat Global</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/admin.css" rel="stylesheet" />
  <style>
    .card { border: 0; border-radius: 16px; box-shadow: 0 6px 24px rgba(15, 23, 42, .08); }
    .table-wrap { max-height: 520px; overflow: auto; }
    th { position: sticky; top: 0; background: #064e3b !important; color: #fff !important; }
    .progress { height: 22px; }
    .small-input { min-width: 78px; }
  </style>
</head>
<body>
  <div id="adminPageRoot">
    <div id="mosqueListWrap" class="mb-3" hidden></div>

    <div id="calendarTodayBox" class="panel-card mb-3">
      <h2 class="mb-1">Kalender Hari Ini (MyQuran)</h2>
      <div id="calendarTodayText" class="text-secondary">Memuat...</div>
    </div>

    <section class="card p-3 mb-3" id="importSection">
      <h5 class="mb-2">Impor Jadwal Global</h5>
      <p class="small text-secondary mb-3">
        Impor sekali untuk semua masjid. Masing-masing masjid hanya memilih NU / KHGT di Setting.
        Sumber NU: <a href="https://api.myquran.com/v3/cal/today" target="_blank" rel="noopener">MyQuran</a>.
      </p>
      <div class="row g-2 align-items-end">
        <div class="col-md-2">
          <label class="form-label">Provider</label>
          <select id="provider" class="form-select">
            <option value="NU">NU (MyQuran)</option>
            <option value="KHGT">KHGT Muhammadiyah</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Dari</label>
          <input id="fromDate" type="date" class="form-control" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Sampai</label>
          <input id="toDate" type="date" class="form-control" />
        </div>
        <div class="col-md-3" id="locationWrap">
          <label class="form-label">ID Kota MyQuran (NU)</label>
          <input id="locationId" type="text" class="form-control" value="cfa0860e83a4c3a763a7e62d825349f7" />
        </div>
        <div class="col-md-2" id="latWrap" hidden>
          <label class="form-label">Lat (KHGT)</label>
          <input id="khgtLat" type="number" step="any" class="form-control" value="-7.4467" />
        </div>
        <div class="col-md-2" id="lngWrap" hidden>
          <label class="form-label">Lng (KHGT)</label>
          <input id="khgtLng" type="number" step="any" class="form-control" value="112.7181" />
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button id="loadBtn" class="btn btn-primary flex-fill">Tampilkan</button>
          <button id="importBtn" class="btn btn-success flex-fill">Impor 1 Tahun</button>
        </div>
      </div>
      <div id="importBox" class="mt-3" hidden>
        <div class="progress">
          <div id="importProgress" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%">0%</div>
        </div>
        <div id="importStatus" class="small text-secondary mt-1"></div>
      </div>
    </section>

    <section class="card p-3 mb-3">
      <h5 id="formTitle">Tambah Jadwal Manual (Global)</h5>
      <form id="scheduleForm">
        <input id="scheduleId" type="hidden" />
        <div class="row g-2">
          <div class="col-md-2"><label class="form-label">Tanggal</label><input id="prayerDate" type="date" class="form-control" required /></div>
          <div class="col"><label class="form-label">Imsak</label><input id="imsak" type="time" class="form-control small-input" /></div>
          <div class="col"><label class="form-label">Subuh</label><input id="subuh" type="time" class="form-control small-input" required /></div>
          <div class="col"><label class="form-label">Terbit</label><input id="terbit" type="time" class="form-control small-input" /></div>
          <div class="col"><label class="form-label">Dhuha</label><input id="dhuha" type="time" class="form-control small-input" /></div>
          <div class="col"><label class="form-label">Dzuhur</label><input id="dzuhur" type="time" class="form-control small-input" required /></div>
          <div class="col"><label class="form-label">Ashar</label><input id="ashar" type="time" class="form-control small-input" required /></div>
          <div class="col"><label class="form-label">Maghrib</label><input id="maghrib" type="time" class="form-control small-input" required /></div>
          <div class="col"><label class="form-label">Isya</label><input id="isya" type="time" class="form-control small-input" required /></div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" type="submit">Simpan Jadwal</button>
          <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
        </div>
      </form>
    </section>

    <section class="card p-3">
      <div class="d-flex justify-content-between">
        <h5>Daftar Jadwal Global</h5>
        <span id="totalRows" class="badge text-bg-success align-self-center">0 data</span>
      </div>
      <div class="table-wrap">
        <table class="table table-sm table-striped table-hover mb-0">
          <thead>
            <tr>
              <th>Tanggal</th><th>Jenis</th><th>Imsak</th><th>Subuh</th><th>Terbit</th>
              <th>Dhuha</th><th>Dzuhur</th><th>Ashar</th><th>Maghrib</th><th>Isya</th><th>Sumber</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="scheduleRows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="js/db.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/mosque-table.js"></script>
  <script>
    let el = {};
    let currentUser;
    let schedules = [];

    function isoDate(date) {
      return date.toISOString().slice(0, 10);
    }

    function setDefaultDates() {
      const now = new Date();
      const later = new Date(now);
      later.setFullYear(later.getFullYear() + 1);
      el.fromDate.value = isoDate(now);
      el.toDate.value = isoDate(later);
      el.prayerDate.value = isoDate(now);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function syncProviderFields() {
      const isKhgt = el.provider.value === "KHGT";
      document.getElementById("locationWrap").hidden = isKhgt;
      document.getElementById("latWrap").hidden = !isKhgt;
      document.getElementById("lngWrap").hidden = !isKhgt;
    }

    function render() {
      el.totalRows.textContent = `${schedules.length} data`;
      el.scheduleRows.innerHTML = schedules.length
        ? schedules.map((item) => `<tr>
            <td>${escapeHtml(item.prayer_date)}</td><td>${escapeHtml(item.provider)}</td>
            <td>${escapeHtml(item.imsak)}</td><td>${escapeHtml(item.subuh)}</td>
            <td>${escapeHtml(item.terbit)}</td><td>${escapeHtml(item.dhuha)}</td>
            <td>${escapeHtml(item.dzuhur)}</td><td>${escapeHtml(item.ashar)}</td>
            <td>${escapeHtml(item.maghrib)}</td><td>${escapeHtml(item.isya)}</td>
            <td>${escapeHtml(item.source)}</td>
            <td class="text-nowrap">
              <button class="btn btn-sm btn-outline-primary" data-edit="${item.id}">Edit</button>
              <button class="btn btn-sm btn-outline-danger" data-delete="${item.id}">Hapus</button>
            </td>
          </tr>`).join("")
        : '<tr><td colspan="12" class="text-center text-secondary py-4">Belum ada jadwal.</td></tr>';
    }

    async function loadSchedules() {
      const result = await MasjidDB.listPrayers(
        el.provider.value, el.fromDate.value, el.toDate.value
      );
      schedules = result.schedules || [];
      render();
    }

    function resetForm() {
      el.scheduleForm.reset();
      el.scheduleId.value = "";
      el.prayerDate.value = isoDate(new Date());
    }

    function editSchedule(id) {
      const item = schedules.find((row) => String(row.id) === String(id));
      if (!item) return;
      el.scheduleId.value = item.id;
      el.prayerDate.value = item.prayer_date;
      el.provider.value = item.provider;
      syncProviderFields();
      ["imsak", "subuh", "terbit", "dhuha", "dzuhur", "ashar", "maghrib", "isya"]
        .forEach((key) => { el[key].value = item[key] || ""; });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function importYear() {
      const providers = ["NU", "KHGT"];
      const start = new Date();
      const jobs = [];
      for (let offset = 0; offset < 12; offset += 1) {
        const date = new Date(start.getFullYear(), start.getMonth() + offset, 1);
        for (const provider of providers) {
          jobs.push({ provider, year: date.getFullYear(), month: date.getMonth() + 1 });
        }
      }
      el.importBox.hidden = false;
      el.importBtn.disabled = true;
      const options = {
        locationId: el.locationId.value.trim(),
        latitude: Number(el.khgtLat.value),
        longitude: Number(el.khgtLng.value),
      };
      try {
        for (let index = 0; index < jobs.length; index += 1) {
          const job = jobs[index];
          el.importStatus.textContent = `Mengambil ${job.provider} ${job.month}/${job.year}...`;
          await MasjidDB.importPrayerMonth(job.provider, job.year, job.month, options);
          const percent = Math.round(((index + 1) / jobs.length) * 100);
          el.importProgress.style.width = `${percent}%`;
          el.importProgress.textContent = `${percent}%`;
        }
        el.importStatus.textContent = "Impor NU (MyQuran) dan KHGT satu tahun selesai.";
        await loadSchedules();
      } catch (error) {
        el.importStatus.textContent = `Impor terhenti: ${error.message}. Klik lagi untuk melanjutkan.`;
      } finally {
        el.importBtn.disabled = false;
      }
    }

    (async () => {
      currentUser = await AdminShell.mount({
        page: "jadwal",
        title: "Jadwal Sholat Global",
      });
      if (!currentUser) return;

      el = Object.fromEntries(
        ["provider", "fromDate", "toDate", "loadBtn", "importBtn", "importBox",
         "importProgress", "importStatus", "scheduleForm", "scheduleId",
         "prayerDate", "imsak", "subuh", "terbit", "dhuha", "dzuhur", "ashar",
         "maghrib", "isya", "resetBtn", "scheduleRows", "totalRows",
         "locationId", "khgtLat", "khgtLng"].map((id) => [id, document.getElementById(id)])
      );

      if (currentUser.role === "superadmin") {
        const wrap = document.getElementById("mosqueListWrap");
        wrap.hidden = false;
        await MosqueTable.render(wrap, {
          editUrl: "admin.html",
          pageLabel: "Setting Provider",
        });
      }

      try {
        const cal = await MasjidDB.calendarToday();
        const c = cal.calendar;
        document.getElementById("calendarTodayText").innerHTML = c
          ? `<strong>${escapeHtml(c.ce?.today || "")}</strong> · ${escapeHtml(c.hijr?.today || "")}`
          : "Kalender tidak tersedia";
      } catch {
        document.getElementById("calendarTodayText").textContent = "Gagal memuat kalender MyQuran";
      }

      setDefaultDates();
      syncProviderFields();
      document.getElementById("adminTopMeta").textContent = "Jadwal global · semua masjid";

      el.scheduleForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const schedule = {
          id: el.scheduleId.value || undefined,
          provider: el.provider.value,
          prayerDate: el.prayerDate.value,
        };
        ["imsak", "subuh", "terbit", "dhuha", "dzuhur", "ashar", "maghrib", "isya"]
          .forEach((key) => { schedule[key] = el[key].value; });
        try {
          await MasjidDB.savePrayer(schedule);
          resetForm();
          await loadSchedules();
        } catch (error) {
          alert(error.message);
        }
      });

      el.scheduleRows.addEventListener("click", async (event) => {
        const editId = event.target.dataset.edit;
        const deleteId = event.target.dataset.delete;
        if (editId) editSchedule(editId);
        if (deleteId && confirm("Hapus jadwal global ini?")) {
          await MasjidDB.deletePrayer(deleteId);
          await loadSchedules();
        }
      });
      el.loadBtn.addEventListener("click", () => loadSchedules().catch((e) => alert(e.message)));
      el.importBtn.addEventListener("click", importYear);
      el.resetBtn.addEventListener("click", resetForm);
      el.provider.addEventListener("change", () => {
        syncProviderFields();
        loadSchedules().catch((e) => alert(e.message));
      });

      await loadSchedules();
    })().catch((error) => alert(error.message));
  </script>
</body>
</html>
